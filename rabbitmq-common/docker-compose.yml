services:
  rabbitmq:
    image: rabbitmq:3.13.7-management

    container_name: queue-container

    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mobilityqueueuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-Strong-password1}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/mobility}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    restart: unless-stopped

volumes:
  rabbitmq_data: