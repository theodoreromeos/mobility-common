services:
  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --aclfile /usr/local/etc/redis/users.acl